name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Instalar dependencias del proyecto
        run: |
          npm install --legacy-peer-deps

      - name: Compilar aplicación Web (Vite)
        run: |
          npm run build

      - name: Agregar y sincronizar plataforma Android
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Dar permisos de ejecución a Gradle
        run: |
          chmod +x ./android/gradlew

      - name: Compilar APK con Gradle
        working-directory: ./android
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Subir APK generado para descargar
        uses: actions/upload-artifact@v4
        with:
          name: Control-de-Pagos-v1.4-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
